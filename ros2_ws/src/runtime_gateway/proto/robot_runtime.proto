syntax = "proto3";

package runtime_gateway;

service RobotRuntime {
  rpc SubmitWorkflow(SubmitWorkflowRequest) returns (SubmitWorkflowReply);
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowReply);
  rpc GetTask(GetTaskRequest) returns (TaskRecord);
  rpc GetStats(GetStatsRequest) returns (RuntimeStats);
  // Explicit operator decision for a request whose dispatch outcome is
  // unknown. Never redispatches a device command.
  rpc ResolveUncertain(ResolveUncertainRequest) returns (ResolveUncertainReply);
}

message SubmitWorkflowRequest {
  string request_id = 1;
  string workflow_id = 2;
  string task_id = 3;
  string target_id = 4;
  uint64 timeout_ms = 5;
}

message SubmitWorkflowReply {
  bool accepted = 1;
  string request_id = 2;
  string task_id = 3;
  string state = 4;
  uint32 outcome = 5;
  uint32 error_code = 6;
  string message = 7;
  // Which layer produced error_code: 0 none, 1 executor, 2 orchestrator,
  // 3 device, 4 gateway (see robot_task_interfaces/error_code.hpp). Carried
  // explicitly so a client does not have to decode the number to know whose
  // vocabulary it is reading.
  uint32 error_layer = 8;
}

message CancelWorkflowRequest { string request_id = 1; }

message CancelWorkflowReply {
  bool accepted = 1;
  string state = 2;
  uint32 outcome = 3;
  uint32 error_code = 4;
  string message = 5;
  uint32 error_layer = 6;
}

message GetTaskRequest { string task_id = 1; }

message TaskRecord {
  bool found = 1;
  string task_id = 2;
  // Correlation identity of the recorded execution; empty when the caller
  // supplied none. Identifiers only, not execution evidence.
  string request_id = 11;
  string workflow_id = 12;
  string goal_id = 13;
  string target_id = 3;
  string state = 4;
  uint32 action_status = 5;
  uint32 outcome = 6;
  uint32 error_code = 7;
  uint64 duration_ms = 8;
  string message = 9;
  int64 completed_at_ns = 10;
  uint32 error_layer = 14;
}

message ResolveUncertainRequest {
  string request_id = 1;
  // Terminal state to record: ABORTED, SAFE_STOP, DEVICE_FAULT, CANCELED,
  // COMPLETED or REJECTED. Nothing is dispatched as a result.
  string state = 2;
  string message = 3;
}

message ResolveUncertainReply {
  bool resolved = 1;
  string state = 2;
  string message = 3;
}

message GetStatsRequest {}

message RuntimeStats {
  bool has_data = 1;
  uint64 sample_count = 2;
  repeated uint64 outcome_counts = 3;
  // Latency over successful runs only. A failed run that spent 30 s timing out
  // moved p99 more than a fast completion did, so these are no longer mixed.
  uint64 p50_ms = 4;
  uint64 p95_ms = 5;
  uint64 p99_ms = 6;
  uint64 max_ms = 7;
  string state = 8;
  uint32 error_code = 9;
  string message = 10;
  // The same percentiles over runs that did not succeed, reported separately.
  // has_failure_data is false when there were none.
  bool has_failure_data = 11;
  uint64 failure_count = 12;
  uint64 failure_p50_ms = 13;
  uint64 failure_p95_ms = 14;
  uint64 failure_p99_ms = 15;
  uint64 failure_max_ms = 16;
  // Requests the gateway rejected before any action started. They left no row at
  // all before this field existed, so the success rate could only be biased up.
  uint64 rejected_count = 17;
}
