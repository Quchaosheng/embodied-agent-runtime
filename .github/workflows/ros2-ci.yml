name: ROS 2 CI

on:
  push:
  pull_request:

jobs:
  # Much of the commit history is concurrency and timing work - cancel waits,
  # late acceptance, drain paths, shutdown races - which is exactly what a
  # sanitizer finds and an ordinary test run does not.
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      ROS_DISTRO: jazzy
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST

    steps:
      - uses: actions/checkout@v7

      - uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential can-utils cmake iproute2 kmod \
            libgrpc++-dev libprotobuf-dev libprotoc-dev libsqlite3-dev \
            pkg-config protobuf-compiler protobuf-compiler-grpc \
            python3-colcon-common-extensions python3-rosdep \
            ros-jazzy-behaviortree-cpp
          rosdep update
          rosdep install --from-paths ros2_ws/src --ignore-src \
            --rosdistro jazzy -y

      - name: Build with ${{ matrix.sanitizer }} sanitizer
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select \
              robot_task_interfaces runtime_can virtual_can_device device_bridge \
              task_executor runtime_monitor runtime_history task_orchestrator \
              runtime_gateway ai_task_adapter perception_task_adapter \
            --cmake-args -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      # The transport-backed suites are the ones that construct nodes and move
      # frames, so they are the ones a sanitizer has something to say about.
      - name: Run the concurrency-sensitive suites
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          export TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1"
          export ASAN_OPTIONS="detect_leaks=0 halt_on_error=1"
          # TSan refuses to start under the runner's ASLR layout ("unexpected
          # memory mapping"), so it is run with randomization disabled. ASan does
          # not need this.
          runner=()
          if [ "${{ matrix.sanitizer }}" = thread ]; then
            runner=(setarch -R)
          fi
          set -e
          for suite in runtime_can/test_can_link \
                       device_bridge/test_device_bridge_node \
                       task_executor/test_executor_safety \
                       task_orchestrator/test_orchestrator_faults; do
            echo "::group::${{ matrix.sanitizer }} $suite"
            "${runner[@]}" "./ros2_ws/build/$suite" --gtest_repeat=2
            echo "::endgroup::"
          done

  windows-tools:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            foreach ($parseError in $errors) {
              Write-Error "$($_.Name): $($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: Test Windows WSL tool behavior
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/test_windows_wsl.ps1

  build-test:
    runs-on: ubuntu-24.04
    env:
      ROS_DISTRO: jazzy
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST

    steps:
      - uses: actions/checkout@v7

      - name: Check bilingual documentation and repository boundaries
        run: python3 scripts/check_docs.py

      - name: Check the stated test-case count matches the tree
        run: python3 scripts/count_test_cases.py --check

      - uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: jazzy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            can-utils \
            cmake \
            iproute2 \
            kmod \
            libgrpc++-dev \
            libprotobuf-dev \
            libprotoc-dev \
            libsqlite3-dev \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc \
            python3-colcon-common-extensions \
            python3-rosdep \
            ripgrep \
            ros-jazzy-behaviortree-cpp
          rosdep update
          rosdep install --from-paths ros2_ws/src --ignore-src \
            --rosdistro jazzy -y

      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Test ARM64 configuration behavior
        run: bash scripts/test_arm64_configuration.sh

      - name: Build eleven packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build \
            --packages-select \
              robot_task_interfaces runtime_can virtual_can_device device_bridge \
              task_executor runtime_monitor runtime_history task_orchestrator \
              runtime_gateway ai_task_adapter perception_task_adapter \
            --cmake-args -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Test eleven packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          set +e
          colcon test \
            --executor sequential \
            --packages-select \
              robot_task_interfaces runtime_can virtual_can_device device_bridge \
              task_executor runtime_monitor runtime_history task_orchestrator \
              runtime_gateway ai_task_adapter perception_task_adapter \
            --return-code-on-test-failure
          test_status=$?
          result_file="$(mktemp)"
          colcon test-result --test-result-base build --verbose \
            >"$result_file" 2>&1
          result_status=$?
          cat "$result_file"
          if ((test_status != 0 || result_status != 0)); then
            annotation="$(tail -c 30000 "$result_file")"
            annotation="${annotation//'%'/'%25'}"
            annotation="${annotation//$'\r'/'%0D'}"
            annotation="${annotation//$'\n'/'%0A'}"
            printf '::error title=ROS 2 test failures::%s\n' "$annotation"
            exit 1
          fi

      # This used to be best-effort: the vcan module load was `|| true` and a
      # runner that could not create the interface turned the only test of the
      # integrated path into a notice nobody reads, so a green run did not mean
      # the path worked. It now fails instead of skipping.
      - name: Run industrial vcan E2E
        shell: bash
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          ip link show vcan0
          WORKSPACE="$GITHUB_WORKSPACE/ros2_ws" SETUP_VCAN=0 \
            bash scripts/run_industrial_e2e.sh

      # A failure in the step above is otherwise a single line with no evidence.
      - name: Upload the E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            **/e2e-evidence/**
            **/evidence/**
          if-no-files-found: ignore
          retention-days: 7

      # Unstable tests are hunted here rather than by re-running CI: a case that
      # only fails under load is a property of the test, and repeating it is the
      # only way to see it.
      - name: Repeat the safety suites to find unstable cases
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          set -e
          for suite in task_executor/test_executor_safety \
                       task_orchestrator/test_orchestrator_faults \
                       device_bridge/test_device_bridge_node; do
            echo "::group::--gtest_repeat=5 $suite"
            "./ros2_ws/build/$suite" --gtest_repeat=5 --gtest_break_on_failure
            echo "::endgroup::"
          done
